<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizcord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .scrollbar::-webkit-scrollbar { width: 8px; }
    .scrollbar::-webkit-scrollbar-track { background: transparent; }
    .scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .scrollbar::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    .msg-enter { animation: msgIn 0.2s ease-out; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .voice-pulse { animation: pulse-green 2s infinite; }
    @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); } 70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
    .tab-active { border-bottom: 2px solid #6366f1; color: #818cf8; }
    .tab-inactive { color: #9ca3af; }
    .tab-inactive:hover { color: #d1d5db; }
  </style>
</head>
<body class="bg-[#1a1b1e] text-gray-100 h-screen overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- AUTH / LOGIN -->
  <div id="auth" class="h-full flex items-center justify-center p-4">
    <div class="bg-[#25262b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-800">
      <h1 class="text-3xl font-bold text-center mb-2 text-indigo-400">Quizcord</h1>
      <p class="text-gray-400 text-center mb-6 text-sm">Entre com sua conta ou use como convidado.</p>
      
      <!-- Tabs -->
      <div class="flex mb-6 border-b border-gray-700">
        <button onclick="switchTab('login')" id="tab-login" class="flex-1 pb-2 text-sm font-medium tab-active transition">Entrar</button>
        <button onclick="switchTab('register')" id="tab-register" class="flex-1 pb-2 text-sm font-medium tab-inactive transition">Criar conta</button>
      </div>

      <!-- Login -->
      <div id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Usuario</label>
          <input id="login-user" type="text" placeholder="seu_usuario" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition lowercase">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Senha</label>
          <input id="login-pass" type="password" placeholder="********" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <button onclick="doLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition transform active:scale-95">Entrar</button>
      </div>

      <!-- Register -->
      <div id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Usuario</label>
          <input id="reg-user" type="text" placeholder="seu_usuario" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition lowercase">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nome de exibicao</label>
          <input id="reg-display" type="text" placeholder="Como te chamam?" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Senha</label>
          <input id="reg-pass" type="password" placeholder="********" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Cor do avatar</label>
          <div class="flex gap-2 flex-wrap" id="color-picker"></div>
        </div>
        <button onclick="doRegister()" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-3 rounded-lg transition transform active:scale-95">Criar conta</button>
      </div>

      <div class="mt-6 pt-4 border-t border-gray-800 text-center">
        <p class="text-xs text-gray-500 mb-3">Ou entre sem conta</p>
        <button onclick="showGuest()" class="text-sm text-gray-400 hover:text-white transition underline">Entrar como convidado</button>
      </div>
    </div>
  </div>

  <!-- GUEST FORM -->
  <div id="guest" class="hidden h-full flex items-center justify-center p-4">
    <div class="bg-[#25262b] p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-800">
      <h1 class="text-3xl font-bold text-center mb-2 text-indigo-400">Quizcord</h1>
      <p class="text-gray-400 text-center mb-8 text-sm">Modo convidado — sem registro.</p>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Seu nome</label>
          <input id="guest-nick" type="text" maxlength="32" placeholder="Anonimo" class="w-full bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Cor do avatar</label>
          <div class="flex gap-2 flex-wrap" id="guest-color-picker"></div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Sala</label>
          <div class="flex gap-2">
            <input id="guest-room" type="text" placeholder="nome-da-sala" class="flex-1 bg-[#1a1b1e] border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition lowercase">
            <button onclick="createRoom()" class="bg-gray-700 hover:bg-gray-600 px-4 rounded-lg text-sm font-medium transition">Criar</button>
          </div>
        </div>
        <button onclick="enterGuest()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition transform active:scale-95">Entrar no Chat</button>
        <button onclick="backToAuth()" class="w-full text-sm text-gray-500 hover:text-gray-300 transition mt-2">Voltar</button>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden h-full flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-[#25262b] border-r border-gray-800 flex flex-col">
      <div class="p-4 border-b border-gray-800">
        <h2 class="font-bold text-indigo-400 text-lg">Quizcord</h2>
        <p id="current-room-display" class="text-xs text-gray-500 mt-1">Sala: -</p>
      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-1 scrollbar">
        <p class="text-xs font-bold text-gray-500 uppercase px-2 mb-2">Salas ativas</p>
        <div id="room-list" class="space-y-1"></div>
        <div class="mt-6 border-t border-gray-800 pt-4">
          <p class="text-xs font-bold text-gray-500 uppercase px-2 mb-2">Canal de Voz</p>
          <button id="btn-voice" onclick="toggleVoice()" class="w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-2 rounded-lg transition mb-3">
            <span id="voice-icon">🎤</span>
            <span id="voice-text">Entrar na Voz</span>
          </button>
          <div id="voice-users" class="space-y-2"></div>
        </div>
      </div>
      <div class="p-3 border-t border-gray-800">
        <div class="flex items-center gap-3">
          <div id="my-avatar" class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"></div>
          <div class="flex-1 min-w-0">
            <p id="my-name" class="text-sm font-medium truncate"></p>
            <p id="my-status" class="text-xs text-green-400">Online</p>
          </div>
          <button onclick="logout()" class="text-xs text-gray-500 hover:text-red-400 transition" title="Sair">🚪</button>
        </div>
      </div>
    </aside>

    <!-- Chat -->
    <main class="flex-1 flex flex-col bg-[#1a1b1e]">
      <header class="h-14 border-b border-gray-800 flex items-center px-4 justify-between bg-[#25262b]">
        <div class="flex items-center gap-2">
          <span class="text-gray-400">#</span>
          <span id="header-room" class="font-semibold">geral</span>
        </div>
        <div id="typing-indicator" class="hidden text-xs text-gray-400 flex items-center gap-1">
          <span id="typing-name">Alguem</span> esta digitando
          <div class="flex gap-0.5 ml-1"><div class="w-1 h-1 bg-gray-400 rounded-full typing-dot"></div><div class="w-1 h-1 bg-gray-400 rounded-full typing-dot"></div><div class="w-1 h-1 bg-gray-400 rounded-full typing-dot"></div></div>
        </div>
      </header>
      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar"></div>
      <div class="p-4 bg-[#25262b] border-t border-gray-800">
        <div id="preview" class="hidden mb-2 relative inline-block">
          <img id="preview-img" class="max-h-32 rounded-lg border border-gray-700">
          <button onclick="clearFile()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
        </div>
        <div class="flex gap-2 items-end">
          <div class="flex-1 bg-[#1a1b1e] border border-gray-700 rounded-lg flex items-end">
            <button onclick="document.getElementById('file').click()" class="p-3 text-gray-400 hover:text-white transition">📎</button>
            <textarea id="input" rows="1" placeholder="Mensagem #geral" class="flex-1 bg-transparent p-3 focus:outline-none resize-none max-h-32 scrollbar" onkeydown="handleKey(event)"></textarea>
            <button onclick="toggleEmoji()" class="p-3 text-gray-400 hover:text-white transition">😀</button>
          </div>
          <button onclick="send()" class="bg-indigo-600 hover:bg-indigo-500 p-3 rounded-lg transition h-10 w-10 flex items-center justify-center">➤</button>
        </div>
        <input type="file" id="file" class="hidden" accept="image/*" onchange="handleFile(this)">
        <div id="emoji-panel" class="hidden absolute bottom-20 right-4 bg-[#25262b] border border-gray-700 rounded-lg p-2 grid grid-cols-8 gap-1 max-h-48 overflow-y-auto z-50"></div>
      </div>
    </main>

    <!-- Users -->
    <aside class="w-60 bg-[#25262b] border-l border-gray-800 flex flex-col">
      <div class="p-4 border-b border-gray-800">
        <h3 class="text-xs font-bold text-gray-500 uppercase">Online — <span id="user-count">0</span></h3>
      </div>
      <div id="user-list" class="flex-1 overflow-y-auto p-3 space-y-2 scrollbar"></div>
    </aside>
  </div>

  <script>
    const COLORS = ['#5865F2','#EB459E','#3BA55D','#FAA61A','#ED4245','#57F287','#FEE75C','#9B59B6','#1ABC9C','#E74C3C'];
    let state = { nick:'', color:COLORS[0], room:'', ws:null, fileUrl:null, users:[], typingTimer:null, myUserId:null, inVoice:false, token:null, isGuest:false };
    let voicePeers = {};
    let localStream = null;
    const ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // ─── AUTH UI ───
    function switchTab(tab) {
      document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
      document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tab-login').className = 'flex-1 pb-2 text-sm font-medium transition ' + (tab === 'login' ? 'tab-active' : 'tab-inactive');
      document.getElementById('tab-register').className = 'flex-1 pb-2 text-sm font-medium transition ' + (tab === 'register' ? 'tab-active' : 'tab-inactive');
    }

    function showGuest() {
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('guest').classList.remove('hidden');
      initGuestColors();
    }

    function backToAuth() {
      document.getElementById('guest').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
    }

    function initColors() {
      const pick = (c, elId) => {
        state.color = c;
        document.querySelectorAll(`#${elId} button`).forEach(b => {
          b.style.borderColor = b.dataset.color === c ? '#fff' : 'transparent';
        });
      };
      ['color-picker'].forEach(id => {
        const el = document.getElementById(id);
        if(!el) return;
        el.innerHTML = COLORS.map(c => 
          `<button onclick="window.setRegColor('${c}')" class="w-8 h-8 rounded-full border-2 transition hover:scale-110" style="background:${c};border-color:transparent" data-color="${c}"></button>`
        ).join('');
      });
      window.setRegColor = (c) => {
        state.color = c;
        document.querySelectorAll('#color-picker button').forEach(b => {
          b.style.borderColor = b.dataset.color === c ? '#fff' : 'transparent';
        });
      };
      window.setRegColor(COLORS[0]);
    }

    function initGuestColors() {
      const el = document.getElementById('guest-color-picker');
      if(!el) return;
      el.innerHTML = COLORS.map(c => 
        `<button onclick="window.setGuestColor('${c}')" class="w-8 h-8 rounded-full border-2 transition hover:scale-110" style="background:${c};border-color:transparent" data-color="${c}"></button>`
      ).join('');
      window.setGuestColor = (c) => {
        state.color = c;
        document.querySelectorAll('#guest-color-picker button').forEach(b => {
          b.style.borderColor = b.dataset.color === c ? '#fff' : 'transparent';
        });
      };
      window.setGuestColor(COLORS[0]);
    }

    initColors();

    async function doLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      if(!user || !pass) return alert('Preenche usuario e senha!');
      try {
        const form = new FormData();
        form.append('username', user);
        form.append('password', pass);
        const res = await fetch('/api/login', {method:'POST', body:form});
        const data = await res.json();
        if(!res.ok) return alert(data.detail || 'Erro no login');
        localStorage.setItem('quizcord_token', data.token);
        state.token = data.token;
        state.isGuest = false;
        enterApp(data.user.display_name || data.user.username, data.user.color, data.user.id);
      } catch(e) { alert('Erro ao conectar'); }
    }

    async function doRegister() {
      const user = document.getElementById('reg-user').value.trim();
      const display = document.getElementById('reg-display').value.trim();
      const pass = document.getElementById('reg-pass').value;
      if(!user || !pass) return alert('Preenche usuario e senha!');
      if(pass.length < 4) return alert('Senha muito curta!');
      try {
        const form = new FormData();
        form.append('username', user);
        form.append('password', pass);
        form.append('display_name', display || user);
        form.append('color', state.color);
        const res = await fetch('/api/register', {method:'POST', body:form});
        const data = await res.json();
        if(!res.ok) return alert(data.detail || 'Erro no registro');
        localStorage.setItem('quizcord_token', data.token);
        state.token = data.token;
        state.isGuest = false;
        enterApp(data.user.display_name || data.user.username, data.user.color, data.user.id);
      } catch(e) { alert('Erro ao conectar'); }
    }

    function enterGuest() {
      const nick = document.getElementById('guest-nick').value.trim();
      const room = document.getElementById('guest-room').value.trim().toLowerCase();
      if(!nick || !room) return alert('Preenche nome e sala!');
      state.token = null;
      state.isGuest = true;
      localStorage.removeItem('quizcord_token');
      enterApp(nick, state.color, null, room);
    }

    function logout() {
      localStorage.removeItem('quizcord_token');
      location.reload();
    }

    // ─── APP ENTRY ───
    async function enterApp(name, color, userId, forcedRoom) {
      state.nick = name; state.color = color; state.myUserId = userId;
      const room = forcedRoom || document.getElementById('guest-room')?.value?.trim().toLowerCase() || 'geral';
      state.room = room;
      
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('guest').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      
      document.getElementById('my-name').textContent = name;
      document.getElementById('my-avatar').textContent = name[0].toUpperCase();
      document.getElementById('my-avatar').style.background = color;
      document.getElementById('current-room-display').textContent = 'Sala: ' + room;
      document.getElementById('header-room').textContent = room;
      
      loadRooms();
      connect();
    }

    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms');
        const rooms = await res.json();
        const el = document.getElementById('room-list');
        el.innerHTML = rooms.map(r => 
          `<button onclick="joinRoom('${r.id}')" class="w-full text-left px-3 py-2 rounded hover:bg-gray-800 text-sm text-gray-300 transition"># ${r.name}</button>`
        ).join('');
      } catch(e) { console.log('Erro carregando salas:', e); }
    }

    async function createRoom() {
      const name = (document.getElementById('guest-room')?.value || '').trim();
      if(!name) return alert('Dá um nome pra sala!');
      const form = new FormData(); form.append('name', name);
      await fetch('/api/rooms', {method:'POST', body:form});
      loadRooms();
      alert('Sala criada!');
    }

    function joinRoom(id) {
      const inp = document.getElementById('guest-room');
      if(inp) inp.value = id;
    }

    // ─── AUTO LOGIN ───
    (async () => {
      const tok = localStorage.getItem('quizcord_token');
      if(tok) {
        try {
          const res = await fetch('/api/me?token=' + encodeURIComponent(tok));
          if(res.ok) {
            const user = await res.json();
            state.token = tok;
            state.isGuest = false;
            enterApp(user.display_name || user.username, user.color, user.id);
            return;
          }
        } catch(e) {}
        localStorage.removeItem('quizcord_token');
      }
    })();

    // ─── WEBSOCKET ───
    function connect() {
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${window.location.host}/ws/${state.room}`;
      state.ws = new WebSocket(url);

      state.ws.onopen = () => {
        const payload = state.token ? {token: state.token} : {name: state.nick, color: state.color};
        state.ws.send(JSON.stringify(payload));
      };

      state.ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if(data.type === 'handshake') { state.myUserId = data.user_id; }
        if(data.type === 'history') data.messages.forEach(m => renderMsg(m));
        if(data.type === 'message') { renderMsg(data); notify(data); }
        if(data.type === 'users') updateUsers(data.users);
        if(data.type === 'user_joined' || data.type === 'user_left') updateUsers(data.users);
        if(data.type === 'typing') showTyping(data.user.name);
        
        if(data.type === 'voice_user_joined') {
          updateVoiceUsers(data.voice_users);
          if(data.user.id !== state.myUserId && state.inVoice) createOffer(data.user.id);
        }
        if(data.type === 'voice_user_left') updateVoiceUsers(data.voice_users);
        if(data.type === 'voice_offer' && data.from !== state.myUserId) handleOffer(data.from, data.offer);
        if(data.type === 'voice_answer' && data.from !== state.myUserId) handleAnswer(data.from, data.answer);
        if(data.type === 'voice_ice' && data.from !== state.myUserId) handleIce(data.from, data.candidate);
      };

      state.ws.onclose = () => { setTimeout(connect, 3000); };
    }

    // ─── VOZ ───
    async function toggleVoice() {
      if(state.inVoice) leaveVoice();
      else joinVoice();
    }

    async function joinVoice() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.inVoice = true;
        document.getElementById('voice-text').textContent = 'Sair da Voz';
        document.getElementById('btn-voice').classList.add('bg-green-600', 'hover:bg-green-500');
        document.getElementById('btn-voice').classList.remove('bg-gray-800', 'hover:bg-gray-700');
        state.ws.send(JSON.stringify({type: 'voice_join'}));
      } catch(err) { alert('Permissao de microfone negada.'); }
    }

    function leaveVoice() {
      state.inVoice = false;
      Object.values(voicePeers).forEach(pc => pc.close());
      voicePeers = {};
      if(localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.querySelectorAll('audio[data-voice]').forEach(a => a.remove());
      document.getElementById('voice-text').textContent = 'Entrar na Voz';
      document.getElementById('btn-voice').classList.remove('bg-green-600', 'hover:bg-green-500');
      document.getElementById('btn-voice').classList.add('bg-gray-800', 'hover:bg-gray-700');
      if(state.ws?.readyState === 1) state.ws.send(JSON.stringify({type: 'voice_leave'}));
      updateVoiceUsers([]);
    }

    function createPeerConnection(userId) {
      if(voicePeers[userId]) return voicePeers[userId];
      const pc = new RTCPeerConnection(ICE_SERVERS);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.ontrack = (event) => {
        let audio = document.getElementById(`audio-${userId}`);
        if(!audio) {
          audio = document.createElement('audio');
          audio.id = `audio-${userId}`;
          audio.setAttribute('data-voice', 'true');
          audio.autoplay = true;
          document.body.appendChild(audio);
        }
        audio.srcObject = event.streams[0];
      };
      pc.onicecandidate = (event) => {
        if(event.candidate && state.ws?.readyState === 1) {
          state.ws.send(JSON.stringify({type: 'voice_ice', target: userId, candidate: event.candidate}));
        }
      };
      voicePeers[userId] = pc;
      return pc;
    }

    async function createOffer(userId) {
      const pc = createPeerConnection(userId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      state.ws.send(JSON.stringify({type: 'voice_offer', target: userId, offer: offer}));
    }

    async function handleOffer(fromUserId, offer) {
      const pc = createPeerConnection(fromUserId);
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      state.ws.send(JSON.stringify({type: 'voice_answer', target: fromUserId, answer: answer}));
    }

    async function handleAnswer(fromUserId, answer) {
      const pc = voicePeers[fromUserId];
      if(pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
    }

    async function handleIce(fromUserId, candidate) {
      const pc = voicePeers[fromUserId];
      if(pc) await pc.addIceCandidate(new RTCIceCandidate(candidate));
    }

    function updateVoiceUsers(users) {
      const el = document.getElementById('voice-users');
      if(!users || users.length === 0) { el.innerHTML = ''; return; }
      el.innerHTML = users.map(u => `
        <div class="flex items-center gap-2 px-2 py-1 rounded bg-gray-800/50">
          <div class="w-2 h-2 rounded-full bg-green-500 voice-pulse"></div>
          <span class="text-xs text-gray-300 truncate">${u.name}</span>
        </div>
      `).join('');
    }

    // ─── CHAT ───
    function renderMsg(m) {
      const box = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg-enter flex gap-3 group';
      const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
      const content = m.msg_type === 'image' 
        ? `<a href="${m.file_url}" target="_blank"><img src="${m.file_url}" class="max-h-64 rounded-lg border border-gray-700 hover:border-indigo-500 transition cursor-zoom-in"></a>`
        : `<div class="text-gray-200 leading-relaxed prose prose-invert max-w-none">${marked.parse(m.content || '')}</div>`;
      div.innerHTML = `
        <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold" style="background:${m.user.color}20; color:${m.user.color}; border:2px solid ${m.user.color}40">
          ${m.user.name[0].toUpperCase()}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2">
            <span class="font-semibold text-sm" style="color:${m.user.color}">${m.user.name}</span>
            <span class="text-xs text-gray-600">${time}</span>
          </div>
          ${content}
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      hljs.highlightAll();
    }

    function updateUsers(users) {
      state.users = users;
      document.getElementById('user-count').textContent = users.length;
      document.getElementById('user-list').innerHTML = users.map(u => `
        <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-gray-800 transition">
          <div class="w-2 h-2 rounded-full bg-green-500"></div>
          <span class="text-sm text-gray-300 truncate">${u.name}</span>
        </div>
      `).join('');
    }

    let typingTimeout;
    function showTyping(name) {
      const el = document.getElementById('typing-indicator');
      document.getElementById('typing-name').textContent = name;
      el.classList.remove('hidden');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function notify(m) {
      if(document.hidden && m.user.name !== state.nick) {
        if('Notification' in window && Notification.permission === 'granted') {
          new Notification(m.user.name, {body: m.content || 'Imagem'});
        }
      }
    }
    if('Notification' in window) Notification.requestPermission();

    function handleKey(e) {
      if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      else {
        clearTimeout(state.typingTimer);
        state.typingTimer = setTimeout(() => {
          if(state.ws?.readyState === 1) state.ws.send(JSON.stringify({type:'typing'}));
        }, 300);
      }
    }

    async function handleFile(input) {
      const file = input.files[0];
      if(!file) return;
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/upload', {method:'POST', body:form});
      const data = await res.json();
      state.fileUrl = data.url;
      document.getElementById('preview').classList.remove('hidden');
      document.getElementById('preview-img').src = data.url;
    }

    function clearFile() {
      state.fileUrl = null;
      document.getElementById('preview').classList.add('hidden');
      document.getElementById('file').value = '';
    }

    function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if(!text && !state.fileUrl) return;
      if(state.ws?.readyState === 1) {
        state.ws.send(JSON.stringify({content: text, file_url: state.fileUrl}));
        input.value = '';
        input.style.height = 'auto';
        clearFile();
      }
    }

    document.getElementById('input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 128) + 'px';
    });

    const EMOJIS = ['😀','😂','🥰','😎','🤔','😭','😡','👍','👎','🔥','❤️','🎉','💀','🤡','🍺','🍕','🎮','💻','🐶','🐱'];
    document.getElementById('emoji-panel').innerHTML = EMOJIS.map(e => 
      `<button onclick="addEmoji('${e}')" class="hover:bg-gray-700 p-1 rounded text-lg">${e}</button>`
    ).join('');
    function toggleEmoji() { document.getElementById('emoji-panel').classList.toggle('hidden'); }
    function addEmoji(e) { const i = document.getElementById('input'); i.value += e; i.focus(); }
    document.addEventListener('click', e => {
      if(!e.target.closest('#emoji-panel') && !e.target.closest('button[onclick="toggleEmoji()"]')) {
        document.getElementById('emoji-panel').classList.add('hidden');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;600;700&display=swap');

:root {
  --bg: #0f0f12;
  --bg-elevated: rgba(255,255,255,0.03);
  --bg-glass: rgba(20,20,24,0.75);
  --border: rgba(255,255,255,0.06);
  --text: #e2e2e2;
  --text-muted: #888;
  --accent: #ff7b72;
  --accent-2: #a78bfa;
  --online: #4ade80;
  --away: #fbbf24;
  --offline: #6b7280;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Inter', 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ─── DOCK LATERAL ─── */
.dock {
  width: 72px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 12px;
  z-index: 10;
}

.dock-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
  cursor: pointer; transition: all 0.2s;
  position: relative;
  border: 2px solid transparent;
}

.dock-avatar:hover { transform: scale(1.08); }
.dock-avatar.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(255,123,114,0.15);
}

.dock-avatar.home { background: linear-gradient(135deg, #ff7b72, #a78bfa); }

.dock-divider {
  width: 32px; height: 2px;
  background: var(--border);
  border-radius: 1px;
  margin: 4px 0;
}

.dock-circle {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent;
  background: var(--bg-elevated);
  color: var(--text);
}

.dock-circle:hover { transform: scale(1.08); }
.dock-circle.active {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 4px rgba(167,139,250,0.15);
}

.dock-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
  background: var(--bg-elevated);
  border: 1px dashed var(--border);
  color: var(--text-muted);
  font-size: 20px;
}

.dock-btn:hover { color: var(--text); border-color: var(--text-muted); }

/* ─── PAINEL LATERAL ─── */
.panel {
  width: 280px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 5;
}

.panel-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.panel-header h2 {
  font-size: 18px; font-weight: 700;
  font-family: 'Nunito', sans-serif;
}

.panel-header p {
  font-size: 12px; color: var(--text-muted); margin-top: 4px;
}

.panel-scroll {
  flex: 1; overflow-y: auto; padding: 12px;
}

.panel-scroll::-webkit-scrollbar { width: 4px; }
.panel-scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1); border-radius: 2px;
}

/* ─── LISTA DE CONTATOS ─── */
.contact-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.15s;
  margin-bottom: 4px;
}

.contact-item:hover { background: var(--bg-elevated); }

.contact-avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  position: relative; flex-shrink: 0;
}

.contact-status {
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--bg);
}

.contact-status.online { background: var(--online); }
.contact-status.away { background: var(--away); }
.contact-status.offline { background: var(--offline); }

.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-sub { font-size: 12px; color: var(--text-muted); }

/* ─── SOLICITAÇÕES ─── */
.request-item {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
}

.request-actions {
  display: flex; gap: 8px; margin-top: 8px;
}

.btn-sm {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.1); }

.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg-elevated); }

/* ─── TÓPICOS ─── */
.topic-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.15s;
  margin-bottom: 4px;
  font-size: 14px;
}

.topic-tab:hover { background: var(--bg-elevated); }
.topic-tab.active {
  background: rgba(167,139,250,0.12);
  color: var(--accent-2);
}

.topic-icon { font-size: 16px; }

/* ─── ÁREA PRINCIPAL ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

.main-header {
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
}

.main-header h3 { font-size: 16px; font-weight: 600; }

.header-tabs {
  display: flex; gap: 4px;
}

.header-tab {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  color: var(--text-muted);
}

.header-tab:hover { color: var(--text); background: var(--bg-elevated); }
.header-tab.active {
  background: rgba(255,123,114,0.12);
  color: var(--accent);
}

/* ─── CHAT ─── */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08); border-radius: 3px;
}

.welcome-screen {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  color: var(--text-muted);
}

.welcome-screen h1 {
  font-family: 'Nunito', sans-serif;
  font-size: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}

.message-bubble {
  display: flex;
  gap: 12px;
  max-width: 80%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-bubble.own { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
  flex-shrink: 0;
}

.msg-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.msg-author {
  font-size: 12px; font-weight: 600;
  color: var(--text-muted);
}

.msg-content {
  padding: 10px 14px;
  border-radius: var(--radius-md);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  font-size: 14px; line-height: 1.5;
  word-break: break-word;
}

.message-bubble.own .msg-content {
  background: linear-gradient(135deg, rgba(255,123,114,0.15), rgba(167,139,250,0.15));
  border-color: rgba(255,123,114,0.2);
}

.msg-content img {
  max-width: 300px;
  max-height: 300px;
  border-radius: var(--radius-sm);
  display: block; margin-top: 6px;
}

.msg-time {
  font-size: 10px; color: var(--text-muted);
}

/* ─── INPUT ─── */
.input-area {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; gap: 12px; align-items: center;
}

.input-box {
  flex: 1;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 18px;
  color: var(--text);
  font-size: 14px;
  outline: none; transition: all 0.2s;
}

.input-box:focus {
  border-color: rgba(255,123,114,0.3);
  box-shadow: 0 0 0 3px rgba(255,123,114,0.08);
}

.input-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 18px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}

.input-btn:hover { filter: brightness(1.1); transform: scale(1.05); }

.input-btn.secondary {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.input-btn.secondary:hover { color: var(--text); }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 400px;
  max-width: 90vw;
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.modal h3 { font-size: 18px; margin-bottom: 16px; font-family: 'Nunito', sans-serif; }

.modal-input {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}

.modal-input:focus { border-color: var(--accent); }

.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

/* ─── LOGIN / REGISTRO ─── */
.auth-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
}

.auth-card {
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  width: 380px;
  text-align: center;
}

.auth-card h1 {
  font-family: 'Nunito', sans-serif;
  font-size: 28px;
  margin-bottom: 8px;
}

.auth-card p { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }

.auth-input {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}

.auth-input:focus { border-color: var(--accent); }

.auth-btn {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 14px; font-weight: 600;
  cursor: pointer; margin-top: 8px;
}

.auth-btn:hover { filter: brightness(1.1); }

.auth-link {
  color: var(--accent);
  cursor: pointer; font-size: 13px;
  margin-top: 16px; display: inline-block;
}

.color-picker {
  display: flex; gap: 8px; justify-content: center; margin: 12px 0;
}

.color-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
}

.color-dot:hover { transform: scale(1.15); }
.color-dot.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--bg); }

/* ─── UTILS ─── */
.hidden { display: none !important; }

.typing-indicator {
  font-size: 12px; color: var(--text-muted);
  padding: 0 24px 8px;
  font-style: italic;
}

.user-list {
  display: flex; gap: 6px; padding: 0 24px 12px;
}

.user-chip {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  display: flex; align-items: center; gap: 6px;
}

.user-chip-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
</style>
<base target="_blank">
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Aurora</h1>
    <p id="authSubtitle">Entre na sua conta</p>
    <input type="text" id="authUser" class="auth-input" placeholder="Usuario" maxlength="20">
    <input type="password" id="authPass" class="auth-input" placeholder="Senha">
    <div id="regExtra" class="hidden">
      <input type="text" id="authDisplay" class="auth-input" placeholder="Nome de exibicao (opcional)">
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <button class="auth-btn" id="authBtn">Entrar</button>
    <div style="margin-top:12px">
      <button class="btn-ghost btn-sm" id="guestBtn" style="width:100%">Entrar como Convidado</button>
    </div>
    <span class="auth-link" id="authToggle">Criar conta</span>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;width:100%;height:100vh;">
  <!-- DOCK -->
  <div class="dock">
    <div class="dock-avatar home active" id="dockHome" title="Inicio">🏠</div>
    <div class="dock-divider"></div>
    <div id="dockCircles"></div>
    <div class="dock-btn" id="btnCreateCircle" title="Novo Circulo">+</div>
    <div style="flex:1"></div>
    <div class="dock-avatar" id="dockProfile" title="Perfil" style="background:#444;">?</div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Contatos</h2>
      <p id="panelSubtitle">Amigos e conversas</p>
    </div>
    <div class="panel-scroll" id="panelContent"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <h3 id="mainTitle">Bem-vindo</h3>
        <div class="header-tabs hidden" id="topicTabs"></div>
      </div>
      <div style="display:flex;gap:8px;" id="headerActions"></div>
    </div>

    <div class="user-list hidden" id="userList"></div>
    <div class="typing-indicator hidden" id="typingIndicator"></div>

    <div class="chat-area" id="chatArea">
      <div class="welcome-screen" id="welcomeScreen">
        <h1>Aurora</h1>
        <p>Selecione um contato ou circulo para comecar a conversar.<br>Convidados podem entrar em topicos via link.</p>
      </div>
    </div>

    <div class="input-area hidden" id="inputArea">
      <label class="input-btn secondary" title="Enviar arquivo">
        📎
        <input type="file" id="fileInput" style="display:none" accept="image/*">
      </label>
      <input type="text" class="input-box" id="msgInput" placeholder="Mensagem..." autocomplete="off">
      <button class="input-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <h3 id="modalTitle">Titulo</h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>

// ─── ESTADO ───
const API = '';
let token = localStorage.getItem('aurora_token');
let me = null;
let circles = [];
let friends = { friends: [], pending_sent: [], pending_received: [] };
let dmChats = [];
let currentCircle = null;
let currentTopic = null;
let currentDM = null;
let ws = null;
let typingTimer = null;
let isGuest = false;
let selectedColor = '#ff7b72';

const COLORS = ['#ff7b72','#a78bfa','#4ade80','#fbbf24','#60a5fa','#f472b6','#22d3ee'];

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  renderColorPicker();
  if (token) { verifyAndLoad(); }
  else { showAuth(); }
  bindAuth();
  bindInputs();
});

function renderColorPicker() {
  const el = document.getElementById('colorPicker');
  el.innerHTML = COLORS.map(c =>
    `<div class="color-dot ${c===selectedColor?'selected':''}" style="background:${c}" data-color="${c}"></div>`
  ).join('');
  el.querySelectorAll('.color-dot').forEach(d => d.onclick = () => {
    selectedColor = d.dataset.color;
    renderColorPicker();
  });
}

function bindAuth() {
  const btn = document.getElementById('authBtn');
  const toggle = document.getElementById('authToggle');
  const guest = document.getElementById('guestBtn');
  let mode = 'login';

  toggle.onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    document.getElementById('authSubtitle').textContent = mode === 'login' ? 'Entre na sua conta' : 'Criar nova conta';
    btn.textContent = mode === 'login' ? 'Entrar' : 'Criar conta';
    toggle.textContent = mode === 'login' ? 'Criar conta' : 'Ja tenho conta';
    document.getElementById('regExtra').classList.toggle('hidden', mode === 'login');
  };

  btn.onclick = async () => {
    const u = document.getElementById('authUser').value.trim();
    const p = document.getElementById('authPass').value;
    if (!u || !p) return alert('Preencha usuario e senha');

    const fd = new FormData();
    fd.append('username', u);
    fd.append('password', p);
    if (mode === 'register') {
      fd.append('display_name', document.getElementById('authDisplay').value || u);
      fd.append('color', selectedColor);
    }

    const res = await fetch(API + '/api/' + mode, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) return alert(data.detail || 'Erro');
    token = data.token;
    me = data.user;
    localStorage.setItem('aurora_token', token);
    enterApp();
  };

  guest.onclick = () => {
    isGuest = true;
    me = { id: 'guest_' + Math.random().toString(36).slice(2,8), name: 'Convidado', color: '#888', is_guest: true };
    enterApp();
  };
}

async function verifyAndLoad() {
  const res = await fetch(API + '/api/me?token=' + token);
  if (!res.ok) { localStorage.removeItem('aurora_token'); token = null; showAuth(); return; }
  me = await res.json();
  enterApp();
}

function showAuth() {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('app').classList.add('hidden');
}

function enterApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('dockProfile').textContent = (me.display_name || me.name || me.username || '?')[0].toUpperCase();
  document.getElementById('dockProfile').style.background = me.color || '#444';
  loadData();
}

async function loadData() {
  if (isGuest) { renderDock(); showHome(); return; }
  const [cRes, fRes, dRes] = await Promise.all([
    fetch(API + '/api/circles?token=' + token),
    fetch(API + '/api/friends?token=' + token),
    fetch(API + '/api/dm-chats?token=' + token)
  ]);
  circles = cRes.ok ? await cRes.json() : [];
  friends = fRes.ok ? await fRes.json() : { friends: [], pending_sent: [], pending_received: [] };
  dmChats = dRes.ok ? await dRes.json() : [];
  renderDock();
  showHome();
}

// ─── DOCK ───
function renderDock() {
  const container = document.getElementById('dockCircles');
  container.innerHTML = circles.map(c =>
    `<div class="dock-circle" data-id="${c.id}" style="background:${c.color}20;color:${c.color};border-color:${c.color}40" title="${c.name}">${c.name[0].toUpperCase()}</div>`
  ).join('');
  container.querySelectorAll('.dock-circle').forEach(el => {
    el.onclick = () => selectCircle(el.dataset.id);
  });
}

document.getElementById('dockHome').onclick = () => {
  setActiveDock('dockHome');
  showHome();
};

function setActiveDock(id) {
  document.querySelectorAll('.dock-avatar, .dock-circle').forEach(d => d.classList.remove('active'));
  const el = document.getElementById(id) || document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.add('active');
}

// ─── HOME / CONTATOS ───
function showHome() {
  currentCircle = null; currentTopic = null; currentDM = null;
  closeWS();
  document.getElementById('panelTitle').textContent = 'Contatos';
  document.getElementById('panelSubtitle').textContent = 'Amigos e conversas';
  document.getElementById('mainTitle').textContent = 'Inicio';
  document.getElementById('topicTabs').classList.add('hidden');
  document.getElementById('headerActions').innerHTML = `
    <button class="btn-sm btn-ghost" onclick="openAddFriend()">+ Adicionar</button>
  `;
  document.getElementById('chatArea').innerHTML = `
    <div class="welcome-screen">
      <h1>Aurora</h1>
      <p>Selecione um amigo na lista ao lado ou entre em um Circulo.</p>
    </div>
  `;
  document.getElementById('inputArea').classList.add('hidden');
  document.getElementById('userList').classList.add('hidden');

  const html = [];

  if (friends.pending_received.length) {
    html.push(`<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:12px 8px 8px;">Solicitacoes</div>`);
    friends.pending_received.forEach(r => {
      html.push(`
        <div class="request-item">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="contact-avatar" style="background:${r.avatar_color}20;color:${r.avatar_color}">${(r.display_name||r.username)[0].toUpperCase()}</div>
            <div><div class="contact-name">${r.display_name || r.username}</div><div class="contact-sub">@${r.username}</div></div>
          </div>
          <div class="request-actions">
            <button class="btn-sm btn-primary" onclick="acceptFriend('${r.fid}')">Aceitar</button>
            <button class="btn-sm btn-ghost" onclick="rejectFriend('${r.fid}')">Recusar</button>
          </div>
        </div>
      `);
    });
  }

  if (friends.friends.length) {
    html.push(`<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:16px 8px 8px;">Amigos (${friends.friends.length})</div>`);
    friends.friends.forEach(f => {
      const dm = dmChats.find(d => d.peer_id === f.fid);
      html.push(`
        <div class="contact-item" onclick="openDM('${f.fid}', '${(f.display_name||f.username).replace(/'/g,"\'")}', '${f.avatar_color}')">
          <div class="contact-avatar" style="background:${f.avatar_color}20;color:${f.avatar_color}">
            ${(f.display_name||f.username)[0].toUpperCase()}
            <div class="contact-status offline"></div>
          </div>
          <div class="contact-info">
            <div class="contact-name">${f.display_name || f.username}</div>
            <div class="contact-sub">@${f.username}</div>
          </div>
        </div>
      `);
    });
  } else if (!friends.pending_received.length) {
    html.push(`<div style="text-align:center;color:var(--text-muted);padding:40px 20px;font-size:13px;">Nenhum amigo ainda.<br>Use "+ Adicionar" para comecar.</div>`);
  }

  document.getElementById('panelContent').innerHTML = html.join('');
}

async function openAddFriend() {
  const u = prompt('Nome de usuario:');
  if (!u) return;
  const fd = new FormData();
  fd.append('token', token);
  fd.append('username', u);
  const res = await fetch(API + '/api/friends/request', { method: 'POST', body: fd });
  if (!res.ok) { const d = await res.json(); alert(d.detail || 'Erro'); }
  else { alert('Solicitacao enviada!'); loadData(); }
}

async function acceptFriend(fid) {
  const fd = new FormData();
  fd.append('token', token);
  fd.append('friend_id', fid);
  await fetch(API + '/api/friends/accept', { method: 'POST', body: fd });
  loadData();
}

async function rejectFriend(fid) {
  const fd = new FormData();
  fd.append('token', token);
  fd.append('friend_id', fid);
  await fetch(API + '/api/friends/reject', { method: 'POST', body: fd });
  loadData();
}

// ─── CIRCLE ───
async function selectCircle(id) {
  setActiveDock(id);
  currentCircle = circles.find(c => c.id === id);
  currentDM = null;
  if (!currentCircle) return;

  const res = await fetch(API + '/api/circles/' + id + '?token=' + token);
  if (!res.ok) return;
  const data = await res.json();
  currentCircle = data.circle;
  currentCircle.members = data.members;
  currentCircle.topics = data.topics;

  document.getElementById('panelTitle').textContent = currentCircle.name;
  document.getElementById('panelSubtitle').textContent = currentCircle.members.length + ' membros';
  document.getElementById('mainTitle').textContent = currentCircle.name;

  // Ações do header
  const isOwner = data.members.find(m => m.id === me.id)?.role === 'owner';
  document.getElementById('headerActions').innerHTML = isOwner
    ? `<button class="btn-sm btn-ghost" onclick="openCreateTopic()">+ Topico</button>`
    : '';

  // Tópicos como abas
  const tabs = document.getElementById('topicTabs');
  tabs.classList.remove('hidden');
  tabs.innerHTML = currentCircle.topics.map(t =>
    `<div class="header-tab ${currentTopic?.id===t.id?'active':''}" data-tid="${t.id}">${t.name}</div>`
  ).join('');
  tabs.querySelectorAll('.header-tab').forEach(el => {
    el.onclick = () => selectTopic(el.dataset.tid);
  });

  // Painel lateral: lista de tópicos + membros
  let html = `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:8px;">Topicos</div>`;
  currentCircle.topics.forEach(t => {
    const icon = t.type === 'voice' ? '🎤' : t.type === 'media' ? '📎' : '💬';
    html += `<div class="topic-tab ${currentTopic?.id===t.id?'active':''}" onclick="selectTopic('${t.id}')">
      <span class="topic-icon">${icon}</span> ${t.name}
    </div>`;
  });
  html += `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:16px 8px 8px;">Membros</div>`;
  currentCircle.members.forEach(m => {
    html += `<div class="contact-item">
      <div class="contact-avatar" style="background:${m.avatar_color}20;color:${m.avatar_color}">${(m.display_name||m.username)[0].toUpperCase()}</div>
      <div class="contact-info">
        <div class="contact-name">${m.display_name || m.username} ${m.role==='owner'?'👑':''}</div>
        <div class="contact-sub">@${m.username}</div>
      </div>
    </div>`;
  });
  document.getElementById('panelContent').innerHTML = html;

  // Seleciona primeiro tópico automaticamente
  if (currentCircle.topics.length && !currentTopic) {
    selectTopic(currentCircle.topics[0].id);
  }
}

async function selectTopic(tid) {
  currentTopic = currentCircle.topics.find(t => t.id === tid);
  currentDM = null;
  if (!currentTopic) return;

  // Atualiza abas
  document.querySelectorAll('.header-tab').forEach(t => t.classList.toggle('active', t.dataset.tid === tid));
  document.querySelectorAll('.topic-tab').forEach(t => t.classList.toggle('active', t.textContent.includes(currentTopic.name)));

  document.getElementById('mainTitle').textContent = currentCircle.name + ' / ' + currentTopic.name;
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('userList').classList.remove('hidden');

  const roomId = 'topic:' + tid;
  connectWS(roomId);
}

// ─── DM ───
async function openDM(peerId, peerName, peerColor) {
  currentDM = { peerId, peerName, peerColor };
  currentCircle = null; currentTopic = null;
  setActiveDock('dockHome');

  document.getElementById('panelTitle').textContent = 'Contatos';
  document.getElementById('panelSubtitle').textContent = 'Conversa direta';
  document.getElementById('mainTitle').textContent = peerName;
  document.getElementById('topicTabs').classList.add('hidden');
  document.getElementById('headerActions').innerHTML = '';
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('inputArea').classList.remove('hidden');
  document.getElementById('userList').classList.add('hidden');

  // Procura chat existente
  let chat = dmChats.find(d => d.peer_id === peerId);
  if (!chat) {
    // Cria no backend (aceitar amizade já criou, mas se não tiver...)
    // Na verdade, o DM chat é criado no accept. Se não existir, vamos usar um roomId genérico.
    // Simplificação: usamos roomId dm:user1:user2
    const u1 = [me.id, peerId].sort().join(':');
    chat = { id: u1, peer_id: peerId };
  }
  currentDM.chatId = chat.id;
  connectWS('dm:' + chat.id);
}

// ─── WEBSOCKET ───
function connectWS(roomId) {
  closeWS();
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/ws/' + roomId;
  ws = new WebSocket(url);

  ws.onopen = () => {
    ws.send(JSON.stringify({
      token: isGuest ? undefined : token,
      name: me.name || me.display_name || me.username,
      color: me.color || me.avatar_color || '#888'
    }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'history') {
      document.getElementById('chatArea').innerHTML = '';
      msg.messages.forEach(m => appendMessage(m));
    }
    else if (msg.type === 'message') appendMessage(msg);
    else if (msg.type === 'user_joined' || msg.type === 'user_left') renderUserList(msg.users);
    else if (msg.type === 'users') renderUserList(msg.users);
    else if (msg.type === 'typing') showTyping(msg.user);
    else if (msg.type === 'voice_user_joined') renderVoiceUsers(msg.voice_users);
    else if (msg.type === 'voice_user_left') renderVoiceUsers(msg.voice_users);
    else if (msg.type === 'voice_offer') handleVoiceOffer(msg);
    else if (msg.type === 'voice_answer') handleVoiceAnswer(msg);
    else if (msg.type === 'voice_ice') handleVoiceICE(msg);
  };

  ws.onclose = () => { ws = null; };
}

function closeWS() {
  if (ws) { ws.close(); ws = null; }
}

// ─── CHAT UI ───
function appendMessage(m) {
  const area = document.getElementById('chatArea');
  const isOwn = m.user?.id === me.id || m.user?.name === (me.name || me.display_name || me.username);
  const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble ' + (isOwn ? 'own' : '');
  bubble.innerHTML = `
    <div class="msg-avatar" style="background:${m.user?.color||'#444'}20;color:${m.user?.color||'#fff'}">${(m.user?.name||'?')[0].toUpperCase()}</div>
    <div class="msg-body">
      <div class="msg-author">${m.user?.name||'?'}</div>
      <div class="msg-content">${escapeHtml(m.content)}${m.file_url ? `<img src="${m.file_url}" onclick="window.open('${m.file_url}')">` : ''}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;
  area.appendChild(bubble);
  area.scrollTop = area.scrollHeight;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function renderUserList(users) {
  const el = document.getElementById('userList');
  if (!users || !users.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = users.map(u =>
    `<div class="user-chip"><div class="user-chip-dot" style="background:${u.color||'#888'}"></div>${u.name}</div>`
  ).join('');
}

function showTyping(user) {
  const el = document.getElementById('typingIndicator');
  el.textContent = (user?.name || 'Alguem') + ' esta digitando...';
  el.classList.remove('hidden');
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => el.classList.add('hidden'), 2000);
}

// ─── INPUTS ───
function bindInputs() {
  const input = document.getElementById('msgInput');
  const send = document.getElementById('sendBtn');
  const file = document.getElementById('fileInput');

  send.onclick = () => sendMessage();
  input.onkeydown = (e) => {
    if (e.key === 'Enter') sendMessage();
    else if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'typing'}));
  };

  file.onchange = async () => {
    if (!file.files[0]) return;
    const fd = new FormData();
    fd.append('file', file.files[0]);
    const res = await fetch(API + '/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    sendMessage(null, data.url);
    file.value = '';
  };

  document.getElementById('btnCreateCircle').onclick = openCreateCircle;
}

function sendMessage(text, fileUrl) {
  const input = document.getElementById('msgInput');
  const content = text !== undefined ? text : input.value.trim();
  if (!content && !fileUrl) return;
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ content: content || '', file_url: fileUrl || undefined }));
  }
  if (text === undefined) input.value = '';
}

function openModal(title, bodyHtml, actionsHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalActions').innerHTML = actionsHtml;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
};

function openCreateCircle() {
  openModal('Novo Circulo', `
    <input type="text" id="modalCircleName" class="modal-input" placeholder="Nome do circulo">
    <div class="color-picker" id="modalColorPicker"></div>
  `, `
    <button class="btn-sm btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn-sm btn-primary" onclick="doCreateCircle()">Criar</button>
  `);
  const el = document.getElementById('modalColorPicker');
  let sel = COLORS[1];
  el.innerHTML = COLORS.map(c => `<div class="color-dot ${c===sel?'selected':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  el.querySelectorAll('.color-dot').forEach(d => d.onclick = () => {
    sel = d.dataset.c;
    el.innerHTML = COLORS.map(c => `<div class="color-dot ${c===sel?'selected':''}" style="background:${c}" data-c="${c}"></div>`).join('');
    el.querySelectorAll('.color-dot').forEach(x => x.onclick = arguments.callee);
  });
  window._circleColor = () => sel;
}

async function doCreateCircle() {
  const name = document.getElementById('modalCircleName').value.trim();
  if (!name) return alert('Digite um nome');
  const fd = new FormData();
  fd.append('token', token);
  fd.append('name', name);
  fd.append('color', window._circleColor ? window._circleColor() : '#a78bfa');
  const res = await fetch(API + '/api/circles', { method: 'POST', body: fd });
  if (!res.ok) { const d = await res.json(); alert(d.detail || 'Erro'); return; }
  closeModal();
  loadData();
}

function openCreateTopic() {
  if (!currentCircle) return;
  openModal('Novo Topico', `
    <input type="text" id="modalTopicName" class="modal-input" placeholder="Nome do topico">
    <select id="modalTopicType" class="modal-input" style="background:var(--bg-glass)">
      <option value="text">Texto</option>
      <option value="voice">Voz</option>
      <option value="media">Midia</option>
    </select>
  `, `
    <button class="btn-sm btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn-sm btn-primary" onclick="doCreateTopic()">Criar</button>
  `);
}

async function doCreateTopic() {
  const name = document.getElementById('modalTopicName').value.trim();
  const type = document.getElementById('modalTopicType').value;
  if (!name) return;
  const fd = new FormData();
  fd.append('token', token);
  fd.append('name', name);
  fd.append('type', type);
  const res = await fetch(API + '/api/circles/' + currentCircle.id + '/topics', { method: 'POST', body: fd });
  if (!res.ok) { const d = await res.json(); alert(d.detail || 'Erro'); return; }
  closeModal();
  selectCircle(currentCircle.id);
}
